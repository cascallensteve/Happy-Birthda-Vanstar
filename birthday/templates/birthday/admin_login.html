{% extends 'birthday/base.html' %}

{% block title %}Admin Login{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        max-width: 480px;
        margin: 80px auto;
    }

    .login-wrapper h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #0f172a;
    }

    .login-icon {
        text-align: center;
        font-size: 4rem;
        margin-bottom: 15px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #334155;
    }

    .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #6ee7b7;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: #f0fdfa;
    }

    .form-group input:focus {
        outline: none;
        border-color: #0ea5e9;
        box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
    }

    .login-btn {
        width: 100%;
        padding: 16px;
        font-size: 1.1rem;
        margin-top: 10px;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #0ea5e9;
        text-decoration: none;
        font-weight: 500;
    }

    .back-link:hover {
        color: #0284c7;
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card">
        <div class="login-icon">🔐</div>
        <h2>Admin Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary login-btn">Login</button>
        </form>
        <a href="{% url 'home' %}" class="back-link">← Back to Home</a>
    </div>
</div>
{% endblock %}
